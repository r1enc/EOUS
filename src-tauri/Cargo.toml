[package]
name = "eous"
version = "0.1.0"
description = "EOUS desktop application"
authors = ["EOUS"]
edition = "2021"

[lib]
name = "eous_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring-core = "=1.0.0"
serde_json = "1.0.150"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
